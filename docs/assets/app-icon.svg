<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72" width="512" height="512">
  <!-- Flat export of the Android adaptive icon (res/drawable/ic_launcher_background.xml +
       ic_launcher_foreground.xml), cropped to the 72dp visible area of the 108dp canvas. -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="70" y2="108">
      <stop offset="0" stop-color="#7FAEE3"/>
      <stop offset="0.45" stop-color="#2F63AE"/>
      <stop offset="1" stop-color="#102452"/>
    </linearGradient>
  </defs>
  <rect x="18" y="18" width="72" height="72" rx="16" fill="url(#bg)"/>
  <!-- route (glow + line + light centre) -->
  <g fill="none" stroke-linecap="round">
    <path d="M25,73 C33,66 40,63 50,64 C62,65 71,61 74,51 C76,45 78,42 80,40" stroke="#5CC3C6" stroke-opacity="0.333" stroke-width="11"/>
